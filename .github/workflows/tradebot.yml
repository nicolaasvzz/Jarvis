name: TradeBot

on:
  push:
    branches: [claude/jarvis-ai-assistant-9hhbcu]
    paths: ["tradebot/**", ".github/workflows/tradebot.yml"]
  pull_request:
    paths: ["tradebot/**", ".github/workflows/tradebot.yml"]

permissions:
  contents: read

concurrency:
  group: tradebot-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: tradebot

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tradebot/pyproject.toml
      - name: Install (as a downstream user would)
        run: python -m pip install ".[dev]"
      - name: Test
        run: python -m pytest tests -q

  dotnet:
    name: C# TradeBot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build TradeBot/TradeBot.csproj -c Release --nologo
