[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-bot"
version = "1.0.0"
description = "Multi-strategy automated trading bot with backtesting, risk management, and live paper/real trading"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "PyYAML>=6.0",
    "rich>=13.0",
    "requests>=2.28",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
investment-bot = "investment_bot.cli:main"

[tool.setuptools.packages.find]
include = ["investment_bot*"]

[tool.setuptools.package-data]
investment_bot = ["static/*.html"]
