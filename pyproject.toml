[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-assistant"
version = "0.1.0"
description = "Jarvis — a personal AI desktop assistant that runs continuously on Windows and takes instructions from your phone."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings[yaml]>=2.3",
    "platformdirs>=4.2",
    # The default Brain talks to the Gemini API over plain HTTPS, so the
    # base install has to be able to make requests.
    "httpx>=0.27",
]

[project.optional-dependencies]
# Heavy / platform-specific integrations, installed only where needed.
# The default provider (Gemini) needs nothing extra — this is only for
# using Anthropic's hosted models instead.
llm = ["anthropic>=0.40"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
phone = ["httpx>=0.27"]
browser = ["playwright>=1.44"]
desktop = ["pyautogui>=0.9.54", "pygetwindow>=0.0.9"]
vision = ["pillow>=10.0", "pytesseract>=0.3.10", "mss>=9.0"]
# The web dashboard. Needs the api extra; psutil only powers the system
# status panel, which reports itself unavailable without it.
dash = ["psutil>=5.9"]
# Speech out: free Microsoft neural voices, no API key or account.
voice = ["edge-tts>=6.1"]
# Speech out, offline fallback: the voices already installed in Windows.
voice-offline = ["pyttsx3>=2.90"]
# Speech in: transcription on this machine, so recordings never leave it.
listen = ["faster-whisper>=1.0"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
jarvis = "jarvis.app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The dashboard's HTML/CSS/JS are data, not modules, so they need listing
# explicitly or an installed Jarvis would serve 404s for its own UI.
[tool.setuptools.package-data]
"jarvis.dashboard" = ["web/*.html", "web/css/*.css", "web/js/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
exclude = ["src/jarvis/dashboard/templates.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "anthropic.*", "PIL.*", "pyautogui.*", "pygetwindow.*", "pytesseract.*",
    "mss.*", "playwright.*", "edge_tts.*", "pyttsx3.*", "faster_whisper.*",
    "ctranslate2.*", "psutil.*",
]
ignore_missing_imports = true
