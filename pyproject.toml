[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-assistant"
version = "0.1.0"
description = "Jarvis — a personal AI desktop assistant that runs continuously on Windows and takes instructions from your phone."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings[yaml]>=2.3",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
# Heavy / platform-specific integrations, installed only where needed.
llm = ["anthropic>=0.40"]
ollama = ["httpx>=0.27"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
phone = ["httpx>=0.27"]
browser = ["playwright>=1.44"]
desktop = ["pyautogui>=0.9.54", "pygetwindow>=0.0.9"]
vision = ["pillow>=10.0", "pytesseract>=0.3.10", "mss>=9.0"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
jarvis = "jarvis.app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["anthropic.*", "PIL.*", "pyautogui.*", "pygetwindow.*", "pytesseract.*", "mss.*", "playwright.*"]
ignore_missing_imports = true
