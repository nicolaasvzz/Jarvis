# Jarvis configuration — example file.
#
# Copy to config/config.yaml (gitignored) and adjust. Every key is optional;
# anything omitted falls back to the defaults in src/jarvis/config/schema.py.
# Any value can also be overridden per-run with environment variables, e.g.
#   JARVIS_API__PORT=9000
#
# SECRETS NEVER GO IN THIS FILE. API keys and tokens live in environment
# variables or a local .env file — see .env.example.

api:
  host: 127.0.0.1     # use 0.0.0.0 to accept connections from your phone
  port: 8765
  # Other web pages allowed to call this API — e.g. a copy of the frontend
  # hosted somewhere else. Pages on localhost (any port) are always allowed.
  # The API token is still required either way.
  # cors_origins:
  #   - http://192.168.1.20:8080

llm:
  # gemini    = Google's Gemini API. A FREE key from
  #             https://aistudio.google.com/apikey is enough — put it in .env
  #             as GEMINI_API_KEY.
  # anthropic = the hosted Claude API (paid); needs ANTHROPIC_API_KEY in .env.
  # Both can also be set with the short LLM_PROVIDER / LLM_MODEL
  # environment variables, which override this file.
  provider: gemini
  model: gemini-3.8-flash   # omit to get the provider's default model.
                            # gemini-3.5-flash-lite is lighter still.
  max_tokens: 16000

  # -- gemini only --
  thinking_level: low   # minimal | low | medium | high | null (model default).
                        # Thinking counts against the free tier, so low is a
                        # good balance. Gemini 2.5 models need null.
  timeout: 120          # seconds to wait for one answer
  max_retries: 3        # retries when the free tier's per-minute limit is hit
  # temperature: 1.0    # unset = the model's default (Google's advice for 3.x)

  # -- anthropic only --
  effort: high          # low | medium | high | xhigh | max

# The ONLY directory Jarvis may read/write/organize. Defaults to
# <data_dir>/workspace. Uncomment and point it at the folder tree you want
# managed:
# files:
#   root: C:/Users/you/JarvisWorkspace

agent:
  max_step_attempts: 2   # retries per failing step
  max_plan_revisions: 2  # "try another approach" rounds per task
  history_messages: 20   # conversation turns given to the planner as context
  parallel: true         # let independent steps run at the same time
  pool_size: 4           # how many agents may work on one plan at once (1-20).
                         # Only steps the planner marked independent run in
                         # parallel, so raising this never reorders real work.
                         # On the free tier, lower it if you hit rate limits.

logging:
  level: INFO
  console: true
  # directory defaults to the per-user log folder, e.g. on Windows:
  # C:/Users/<you>/AppData/Local/jarvis/Logs
  # directory: D:/jarvis/logs

security:
  # Action categories that always require your confirmation before running.
  require_confirmation:
    - delete_files
    - send_email
    - install_software
    - modify_system_settings
    - spend_money
    - elevated_shell

browser:
  engine: chromium
  headless: false
  # downloads_dir: C:/Users/<you>/Downloads

# Control Jarvis from your phone via a Telegram bot — the recommended remote
# path. It only makes OUTBOUND calls to Telegram, so it needs no wifi/LAN, no
# port forwarding, and no exposed server; works over any internet (even a
# phone/USB tether). The bot token is the TELEGRAM_BOT_TOKEN secret.
telegram:
  enabled: false
  owner_chat_id:      # ONLY this chat may command Jarvis. Message the bot and
                      # send /whoami (or just anything) to learn your chat id,
                      # then paste it here and restart.
  poll_timeout: 30    # long-poll seconds per getUpdates call

# Push-only notifications via an ntfy-compatible server (no bot, no account).
# Subscribe your phone to <topic> in the ntfy app. Also outbound-only.
push:
  enabled: false
  server: https://ntfy.sh
  topic:              # e.g. jarvis-a8f3k2 — pick something unguessable

# The local web dashboard — the heads-up display. Served by the same process
# and port as the API: open http://127.0.0.1:8765/dash (or run `jarvis dash`).
dashboard:
  enabled: true
  particles: 900      # drifting background particles; 0 on a slow machine
  accent: "#22d3ee"
  history_limit: 300  # events back-filled into a freshly opened page
  file_tree_depth: 3
  file_tree_max_nodes: 260
  open_browser: false # launch the browser automatically on `jarvis serve`

# Speech. Out: a British neural voice. In: your microphone, transcribed
# locally — audio never leaves the machine.
voice:
  enabled: true
  provider: edge      # edge (free neural, needs internet) | sapi (offline) | none
  voice: en-GB-RyanNeural   # ThomasNeural = clipped, SoniaNeural = female
  rate: "+8%"
  pitch: "-2Hz"
  speak_events:       # what Jarvis reads aloud unprompted
    - task.completed
    - task.failed
    - approval.required
  listen_enabled: true
  wake_word: jarvis
  wake_word_required: true  # false = every utterance is treated as a command
  stt_provider: whisper     # whisper (local, free) | none
  stt_model: small.en       # base.en is faster, medium.en needs more VRAM
  stt_device: auto          # auto | cuda | cpu
