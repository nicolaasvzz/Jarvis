[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-bot"
version = "1.0.0"
description = "Multi-strategy automated trading bot with backtesting, risk management, and live paper/real trading"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Nicolaas" }]
keywords = ["trading", "backtesting", "algorithmic-trading", "quant", "alpaca"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "PyYAML>=6.0",
    "rich>=13.0",
    "requests>=2.28",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/nicolaasvzz/Jarvis/tree/claude/jarvis-ai-assistant-9hhbcu/tradebot"
Issues = "https://github.com/nicolaasvzz/Jarvis/issues"

[project.scripts]
investment-bot = "investment_bot.cli:main"

[tool.setuptools.packages.find]
include = ["investment_bot*"]

[tool.setuptools.package-data]
investment_bot = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
