<!doctype html>
<html lang="en" data-page="Approvals">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#03070b">
  <title>JARVIS — Approvals</title>
  <link rel="stylesheet" href="css/hud.css">
  <link rel="stylesheet" href="css/approve.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='11' fill='none' stroke='%2322d3ee' stroke-width='3'/><circle cx='16' cy='16' r='4' fill='%2322d3ee'/></svg>">
</head>
<body class="approve-page">

<header class="approve-top">
  <span class="brand" data-app-name>JARVIS</span>
  <nav class="nav">
    <a href="mothership.html">Mothership</a>
    <a href="index.html">Core</a>
    <a href="terminal.html">Terminal</a>
    <a href="approve.html">Approvals</a>
  </nav>
  <span class="approve-conn" data-connection><span class="dot"></span>Connecting</span>
</header>

<main class="approve-main">
  <h1 class="approve-heading">Waiting for you <span id="pending-count"></span></h1>
  <div id="pending">
    <div class="approve-empty">Loading…</div>
  </div>

  <h2 class="approve-sub">Recently</h2>
  <div class="feed" id="recent">
    <div class="empty">Nothing yet.</div>
  </div>
</main>

<div id="toasts"></div>

<div id="gate" style="display:none">
  <div class="card">
    <h1 data-app-name>JARVIS</h1>
    <p data-token-hint>Connect to Jarvis. The token is <code>JARVIS_API_TOKEN</code> in
       <code>backend/.env</code> — <code>jarvis.py</code> makes one on its first run.</p>
    <input name="server" type="url" placeholder="Server — blank means this site" autocomplete="off">
    <input name="token" type="password" placeholder="API token" autocomplete="off">
    <button>Connect</button>
    <div class="err"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="js/lib/connection.js"></script>
<script type="module" src="js/pages/approve.js"></script>
</body>
</html>
